# 型紙：なりすまし送金（ビジネスメール詐欺）
id: bec
damageType: bec
labelJa: なりすまし送金（ビジネスメール詐欺）
descriptionJa: 流出したパスワードで社長のメールに入り、社長になりすまして経理に送金を指示する
stages:
  - id: leak
    labelJa: パスワードが流出している
    breachedJa: 流出している
    breachedDoneJa: 流出していました
    tactics: [TA0043]
    entry: true
    precondition: true
    byRole:
      cloud.mail_account.exec: T1589.001
    accepts: [T1589.001, T1589]
  - id: takeover
    labelJa: 社長のメールに入られる
    breachedJa: 乗っ取られる
    breachedDoneJa: 乗っ取られました
    # 認証情報・セッションの窃取（TA0006）と、窃取したセッションの利用（TA0008）も、この乗っ取りの段階として受け入れる
    tactics: [TA0001, TA0003, TA0006, TA0008]
    byRole:
      cloud.mail_account.exec: T1078.004
    # 流出したパスワードの使い回し（T1110.004）、リンクによるフィッシング、多要素認証の要求の大量送信も乗っ取りとして受け入れる。
    # 多要素認証を通り抜ける手口（セッションの窃取 T1539・利用 T1550.004、多要素認証の傍受 T1111、認証の改変 T1556.006。TRIAL-B-009）は
    # 多要素認証では止まらないので、判定ルールを分ける（bec.takeover_bypass）
    accepts: [T1078.004, T1078, T1110.004, T1566.002, T1621, T1539, T1550.004, T1111, T1556.006]
  - id: impersonate
    labelJa: 社長になりすまして指示する
    breachedJa: 悪用される
    breachedDoneJa: 悪用されました
    tactics: [TA0005]
    byRole:
      cloud.mail_account.exec: T1684.001
    accepts: [T1684.001, T1684.002]
    # 記事が装った相手が取引先のとき（社長ではない）の言い方。判定は変えず、札だけ差し替える（TRIAL-B-005）
    variants:
      partner:
        labelJa: 取引先になりすまして指示する
        breachedJa: 悪用される
        breachedDoneJa: 悪用されました
  - id: human
    labelJa: 経理担当が送金する
    breachedJa: だまされる
    breachedDoneJa: だまされました
    tactics: [TA0002]
    human: true
    byRole:
      person.accounting: null
    # 記事では「担当者が指示に従って操作した」が T1204 と読まれる
    accepts: [T1204, T1204.002]
  - id: money
    labelJa: 資金が流出する
    breachedJa: 起きる
    breachedDoneJa: 起きました
    sentenceJa: "{node}から資金が流出する"
    tactics: [TA0040]
    byRole:
      impact.money: null
    accepts: [T1657]
    terminal: true

# 型紙：情報漏えい（連携用アカウント・API キーの乗っ取り）
# クラウドサービスの API キー・アクセストークン・連携用（サービス）アカウントが、ソースコード置き場への誤公開、設定ファイル、
# 外部サービス側の侵害などで盗まれ、そのキーで正規のアカウントとしてクラウド上の情報にアクセスされ、情報が取得・持ち出される。
# 顧客向けサービスへの不正ログイン（account-takeover-service、会員になりすます）や、メールアカウントの乗っ取り（account-takeover）とは別。
# こちらは人ではなく仕組み（連携・自動処理）のための鍵が破られる事故で、多要素認証では防げない（鍵には追加認証が無い）。
# 全段階がクラウドサービス（会社カルテの役割 cloud.saas）の上で完結するので、カルテにクラウドサービスの資産が無ければ入口なしになる。
# 社内システムの入口（VPN など）は候補に出さない。ATT&CK の手法の水準まで書く
#
# 被害の種類は data_breach。個人情報の報告・通知の期限は data_breach と同じ（damage-types.yaml）
#
# priority は -1：同じ被害の型の型紙と、記事の段階の対応づけも手法の一致数も同数のときは、他の型紙を優先する。
# 入口の種類が「連携用アカウント・API キー」（service-account）と記載のときだけ、同数なら先にする。
# 正規アカウントの悪用（T1078.004）は顧客向けサービスの型紙も受け入れるので、親の T1078 は受け入れず、典型の手法はこの型紙だけが持つ
id: service-account-takeover
damageType: data_breach
labelJa: 情報漏えい（連携用アカウント・API キーの乗っ取り）
descriptionJa: 流出した API キーや連携用アカウントで、正規のアカウントとしてクラウド上の情報にアクセスされ、取得・持ち出される
priority: -1
preferEntryKinds: [service-account]
stages:
  - id: sa-login
    labelJa: 流出した API キー・連携用アカウントで、正規のアカウントとして接続
    breachedJa: 不正に接続される
    breachedDoneJa: 不正に接続されました
    sentenceJa: "{node}に、流出した API キーや連携用アカウントで不正に接続される"
    # 保存された認証情報の窃取（T1552）は戦術では認証情報へのアクセス（TA0006）。記事では初期アクセスとして読まれる
    tactics: [TA0001, TA0006]
    entry: true
    byRole:
      cloud.saas: T1078.004
    # クラウドアカウントの悪用（T1078.004）、保存された認証情報（T1552、コードや設定ファイル内の鍵は T1552.001）、
    # アプリケーションのアクセストークンの窃取（T1528）と利用（T1550.001）
    accepts: [T1078.004, T1552, T1552.001, T1528, T1550.001]
  - id: sa-access
    labelJa: キーに付与された権限の範囲で、クラウド上の情報を取得
    breachedJa: 取得される
    breachedDoneJa: 取得されました
    sentenceJa: "{node}の情報が、キーの権限で取得される"
    tactics: [TA0009]
    byRole:
      cloud.saas: T1213
    # 情報置き場からの取得（T1213：顧客管理・グループウェアなどのクラウドサービス上の情報）。
    # クラウドストレージのファイル取得（T1530）は、別の役割（cloud.storage）の型紙 data-breach の手法なので、ここでは受け入れない。
    # 受け入れると、クラウドサービスの侵害（入口不明）の記事で、顧客向けサービスの型紙（account-takeover-service）より手法の一致が多くなり、
    # これまでの型紙の選択が変わる。この型紙は、入口が連携用アカウント・API キーと読めるときだけ先になるようにしている
    accepts: [T1213]
  - id: sa-exfil
    labelJa: 取得した情報を外部へ持ち出す
    breachedJa: 持ち出される
    breachedDoneJa: 持ち出されました
    sentenceJa: "{node}から情報が持ち出される"
    tactics: [TA0010]
    # 持ち出しまで進まない事故もある（閲覧・取得だけ）。本線ではなく枝にして、記事に出てきたときだけ経路に入れる
    branch: true
    byRole:
      cloud.saas: T1537
    # 別のクラウドアカウントへの転送（T1537）、Web サービスへの持ち出し（T1567）、代替プロトコル（T1048）、C2 経由（T1041）
    accepts: [T1537, T1567, T1048, T1041]
  - id: leak
    labelJa: 個人情報が漏えいする
    breachedJa: 漏えい元になる
    breachedDoneJa: 漏えい元になりました
    tactics: [TA0010]
    byRole:
      cloud.saas: null
    terminal: true

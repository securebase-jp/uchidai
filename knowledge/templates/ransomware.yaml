# 型紙：業務停止（ランサムウェア）
# 段階は役割の枠に対して定義する。byRole は役割ごとの典型手法（記事に無ければ「推定」として埋める）
id: ransomware
damageType: ransomware
labelJa: 業務停止（ランサムウェア）
descriptionJa: 入口から侵入し、管理者権限を奪って社内に広がり、バックアップを消してから暗号化する
stages:
  - id: entry
    labelJa: 入口から侵入
    breachedJa: 侵入される
    breachedDoneJa: 侵入されました
    tactics: [TA0001]
    entry: true
    byRole:
      entry.vpn: T1190
      entry.rdp: T1133
      entry.web: T1190
      entry.vendor_remote: T1133
      pc: T1566
    # 記事で入口として読まれやすい手法。VPN・リモートデスクトップの正規アカウントの悪用（T1078）、
    # フィッシングのサブ手法、水飲み場（T1189）、ソフトウェアのサプライチェーン（T1195.002）、取引先経由（T1199）
    accepts: [T1190, T1133, T1078, T1566, T1566.001, T1566.002, T1189, T1195.002, T1199]
  - id: credentials
    labelJa: 管理者権限を奪う
    breachedJa: 奪われる
    breachedDoneJa: 奪われました
    tactics: [TA0006, TA0004]
    byRole:
      admin: T1003
    accepts: [T1003, T1078, T1110, T1110.004, T1555]
  - id: lateral
    labelJa: サーバへ広がる
    breachedJa: 侵入される
    breachedDoneJa: 侵入されました
    tactics: [TA0008]
    byRole:
      server: T1021
    accepts: [T1021, T1021.001, T1021.002, T1570, T1210]
  - id: exfil
    labelJa: データを持ち出す（二重恐喝）
    breachedJa: 持ち出される
    breachedDoneJa: 持ち出されました
    sentenceJa: "{node}から情報が持ち出される"
    tactics: [TA0010]
    byRole:
      server: T1048
    accepts: [T1048, T1041, T1567]
    # 記事に持ち出し（リークサイトでの公開など）があるときだけ経路に入れる枝。止まっても暗号化の本線は進む
    optional: true
    branch: true
  - id: recovery
    labelJa: バックアップを消す
    breachedJa: 暗号化される
    breachedDoneJa: 暗号化されました
    tactics: [TA0040]
    byRole:
      backup: T1490
    # バックアップの削除は T1485（データの破壊）と読まれることが多い
    accepts: [T1490, T1485]
    optional: true
  - id: encrypt
    labelJa: 暗号化・業務停止
    breachedJa: 暗号化される
    breachedDoneJa: 暗号化されました
    tactics: [TA0040]
    byRole:
      core: T1486
    # 「システムが停止した」は T1489（サービス停止）と読まれることがある
    accepts: [T1486, T1489]
    terminal: true

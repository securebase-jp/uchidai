# 型紙：業務停止（ランサムウェア）
# 段階は役割の枠に対して定義する。byRole は役割ごとの典型手法（記事に無ければ「推定」として埋める）
id: ransomware
damageType: ransomware
labelJa: 業務停止（ランサムウェア）
descriptionJa: 入口から侵入し、管理者権限を奪って社内に広がり、バックアップを消してから暗号化する
stages:
  - id: entry
    labelJa: 入口から侵入
    breachedJa: 侵入される
    breachedDoneJa: 侵入されました
    tactics: [TA0001]
    entry: true
    byRole:
      entry.vpn: T1190
      entry.rdp: T1133
      entry.web: T1190
      entry.vendor_remote: T1133
      pc: T1566
    # 記事で入口として読まれやすい手法。VPN・リモートデスクトップの正規アカウントの悪用（T1078）、
    # フィッシングのサブ手法、水飲み場（T1189）、ソフトウェアのサプライチェーン（T1195.002）、取引先経由（T1199）
    accepts: [T1190, T1133, T1078, T1566, T1566.001, T1566.002, T1189, T1195.002, T1199]
  - id: credentials
    labelJa: 管理者権限を奪う
    breachedJa: 奪われる
    breachedDoneJa: 奪われました
    tactics: [TA0006, TA0004]
    byRole:
      admin: T1003
    accepts: [T1003, T1078, T1110, T1110.004, T1555]
  - id: persist
    labelJa: 管理者アカウントを作って居座る
    breachedJa: 居座られる
    breachedDoneJa: 居座られました
    tactics: [TA0003]
    byRole:
      admin: T1136
    accepts: [T1136, T1136.001, T1136.002, T1136.003, T1098]
    # 記事に具体的に書かれたときだけ経路に入れる枝（TRIAL-R-005）。止まっても暗号化の本線は進む
    optional: true
    branch: true
  - id: lateral
    labelJa: サーバへ広がる
    breachedJa: 侵入される
    breachedDoneJa: 侵入されました
    tactics: [TA0008]
    byRole:
      server: T1021
    accepts: [T1021, T1021.001, T1021.002, T1570, T1210]
  - id: discover
    labelJa: 社内のサーバや共有を調べる
    breachedJa: 調べられる
    breachedDoneJa: 調べられました
    tactics: [TA0007]
    byRole:
      server: T1018
    # T1083（ファイルとディレクトリの探索）は、情報漏えいの型紙で「収集」の手法として判定ルールを持つ（同じ役割×手法のルールは 1 つ）。
    # ここでは受け入れず、探索のうち社内の機器・共有・アカウントを調べる手法だけを受け入れる
    accepts: [T1018, T1082, T1087, T1087.002, T1135, T1046, T1069, T1016]
    optional: true
    branch: true
  - id: remote
    labelJa: 遠隔操作ツールを仕込む
    breachedJa: 仕込まれる
    breachedDoneJa: 仕込まれました
    tactics: [TA0011]
    byRole:
      server: T1219
    accepts: [T1219, T1219.002]
    optional: true
    branch: true
  - id: evade
    labelJa: ログを消して痕跡を隠す
    breachedJa: 消される
    breachedDoneJa: 消されました
    tactics: [TA0005, TA0112]
    byRole:
      server: T1070
    # 旧 ID の T1070.001（Windows イベントログの消去）は T1685.005 に置き換わっている
    accepts: [T1070, T1070.004, T1070.006, T1685, T1685.001, T1685.005]
    optional: true
    branch: true
  - id: exfil
    labelJa: データを持ち出す（二重恐喝）
    breachedJa: 持ち出される
    breachedDoneJa: 持ち出されました
    tactics: [TA0010]
    byRole:
      server: T1048
    accepts: [T1048, T1041, T1567]
    # 記事に持ち出し（リークサイトでの公開など）があるときだけ経路に入れる枝。止まっても暗号化の本線は進む
    optional: true
    branch: true
  - id: recovery
    labelJa: バックアップを消す
    breachedJa: 暗号化される
    breachedDoneJa: 暗号化されました
    tactics: [TA0040]
    byRole:
      backup: T1490
    # バックアップの削除は T1485（データの破壊）と読まれることが多い
    accepts: [T1490, T1485]
    optional: true
  - id: encrypt
    labelJa: 暗号化・業務停止
    breachedJa: 暗号化される
    breachedDoneJa: 暗号化されました
    tactics: [TA0040]
    byRole:
      core: T1486
    # 「システムが停止した」は T1489（サービス停止）と読まれることがある
    accepts: [T1486, T1489]
    terminal: true

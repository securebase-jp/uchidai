# 被害を受けた側（victim）。記事の被害が、記事の会社そのものに起きたのか、その委託先・取引先・提供元など第三者に起きたのか
# 第三者の事故を、御社の設備が入口になったかのように書かない（「御社の VPN 装置から侵入された」など）ための宣言。
# 判定そのものは同じ（御社が同じ立場だったらどうなるか）だが、見出し・一枚・画面を「第三者で起きた事故。御社が同じ立場なら」で書き、
# 御社が確認することを出す。読解の選択肢と分類基準もここから組み立てる。新しい種類は、ここに 1 件足すだけで効く
#
# id：英小文字・数字・ハイフン。Case の victim に使う。省略は self（記事の会社そのもの）
# thirdParty：true なら第三者の事故として書く
# labelJa：画面と一枚に出す名前（「これは〇〇で起きた事故です」）
# readingHintJa：Claude が記事を読むときの分類基準
# leadNoteJa：一枚と画面で、「これは〇〇で起きた事故です。」に続ける文。省略は「御社の設備が入口になったのではありません。」
#   （グループ会社は、御社との接続があるかが公表から分からないので、入口でないとは言い切らない）
# checksJa：第三者の事故のとき、御社が確認すること（{label} は labelJa に置き換える）
# reportNoteJa：個人情報の報告について（委託元として生じることがある。断定せず「確認が必要」）
# measureIds：対策（measures.yaml。判定には使わない助言）。一枚の対策の一覧に出す
# 根拠：個人情報保護委員会「個人情報の保護に関する法律についてのガイドライン（通則編）」3-4-4 委託先の監督（法第25条）
#   委託先の選定、委託契約の締結、委託先における個人データ取扱状況の把握（knowledge/sources.yaml の ppc-guidelines）
victims:
  - id: self
    labelJa: 記事の会社そのもの
    thirdParty: false
    readingHintJa: 記事の会社（公表した会社・機関）自身のシステムや情報が被害を受けた。御社が同じ立場なら、という通常の事例。被害を受けた組織が「公表した会社自身」か迷うときは self
  - id: vendor
    labelJa: 委託先・取引先
    thirdParty: true
    readingHintJa: 被害を受けたのは、記事を公表した会社・機関ではなく、その委託先・再委託先・取引先の側（記事の会社は、情報を預けていた、仕事を任せていた、取引していた立場）。子会社・孫会社・関係会社は含めない（group）。例：「委託先の従業者の PC がマルウェアに感染し、預けていた情報が流出した」「再委託先がランサムウェアの被害を受け、発注元の情報が流出した可能性がある」「業務委託先の VPN 機器から侵入された」
    checksJa:
      - "{label}に、事故の範囲（影響を受けた情報・期間・件数）と、再発防止の内容を確認する"
      - "契約に事故の連絡義務があるかを確認し、御社への連絡の時期と、取引先・本人への通知が要るかを確かめる"
      - "{label}に預けている個人データや重要データを洗い出し、何をどこまで預けているかを把握する"
    reportNoteJa: "{label}に個人データを預けていて、それが漏えいした場合は、委託元の御社にも、個人情報保護委員会への報告や本人への通知が必要になることがあります。確認が必要です。"
    measureIds:
      - vendor-incident-contact
      - vendor-data-inventory
      - vendor-contract-review
      - vendor-return-delete
      - vendor-audit
  - id: group
    labelJa: グループ会社（子会社・孫会社）
    thirdParty: true
    readingHintJa: 被害を受けたのは、記事を公表した会社（親会社）自身ではなく、その子会社・孫会社・連結子会社・海外子会社など、グループ会社の側。例：「当社の台湾子会社がランサムウェアの被害を受けた」「連結子会社のサーバーが不正アクセスを受けた」「孫会社の従業員のアカウントが乗っ取られた」。親会社自身のシステムが被害を受けたなら self、取引関係だけの会社（委託先・取引先）なら vendor
    leadNoteJa: 子会社と御社の接続の有無は、この公表からは分かりません。
    checksJa:
      - "{label}に、事故の範囲（影響を受けた情報・期間・件数）を確認する"
      - "親会社として報告・開示（個人情報保護委員会、適時開示）が要るかを確かめる"
      - "{label}と親会社のネットワーク・認証基盤の接続の有無を確かめる"
    reportNoteJa: "{label}で個人データが漏えいした場合の報告は、その個人データを取り扱う事業者ごとに必要になります。親会社として、グループで個人データを共同で利用しているなど、報告が必要になる場合があるかは、確認が必要です。"
  - id: provider
    labelJa: クラウド・ソフトウェアの提供元
    thirdParty: true
    readingHintJa: 被害を受けたのは、記事の会社が使っているクラウドサービス・SaaS・ソフトウェアを提供する事業者の側。例：「利用している SaaS の提供事業者が不正アクセスを受け、利用者の情報が流出した」「ソフトウェアの提供元の配布経路が悪用された」
    checksJa:
      - "{label}に、事故の範囲（影響を受けた情報・期間・件数）と、再発防止の内容を確認する"
      - "契約と利用規約に事故の連絡義務があるかを確認し、御社への連絡の時期と、取引先・本人への通知が要るかを確かめる"
      - "{label}に預けている個人データや重要データを洗い出し、何をどこまで預けているかを把握する"
    reportNoteJa: "{label}に個人データを預けていて、それが漏えいした場合は、預けている御社にも、個人情報保護委員会への報告や本人への通知が必要になることがあります。確認が必要です。"
    measureIds:
      - vendor-incident-contact
      - vendor-data-inventory
      - vendor-contract-review
      - vendor-return-delete

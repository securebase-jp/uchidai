# 被害の種類
# 型紙（templates/*.yaml）の damageType は、ここの id を指す。1 つの種類に型紙を複数持てる。
# 新しい攻撃を足すときは、ここに 1 件足し、型紙・判定ルール・（必要なら）役割を足す。コードは変えない。
# out_of_scope（攻撃経路では判定できない事故）は組み込みなので、ここには書かない。
#
# id：英小文字・数字・アンダースコア。型紙の damageType、会社の評価データ、読解の出力に使う
# labelJa：画面に出す名前
# shortJa：Claude への出力指示で使う短い言い方（「〜=○○」の形で並べる）
# readingHintJa：Claude が記事を読むときの分類基準。他の種類との境目が分かるように書く
# day0：時間軸の最初に置く出来事（発覚日）。showMoneyLoss は、送金額の目安を添える
# reachesMoney：到達すると送金額の目安を出す種類（なりすまし送金など）
# stopsOperations：経路が資産に届いたとき、依存する業務が止まる種類か。省略すると true（止まる）。
#   false にすると、止まる業務・復旧日数・売上影響を出さない（取引先への影響日もそこから出るので出ない）。
#   個人情報の報告・通知などの期限、送金額の目安は、そのまま出す。false の種類の day0 は business_stop にしない
# reportsPersonalData：経路が届いた資産の個人データについて、報告義務・期限（個人情報保護委員会、本人通知）を見込む種類か。省略すると true。
#   情報が外に出ない種類（取引先・提供元の停止）は false にする
# 型紙に紐づかない経路（AI 攻撃者の経路）は種類が決まらないので、先頭の種類の day0 を使う
damageTypes:
  - id: ransomware
    labelJa: 業務停止（ランサムウェア）
    shortJa: 暗号化・業務停止
    readingHintJa: ランサムウェアによる暗号化・業務停止。データの持ち出しやリークサイトでの公開（二重恐喝）を伴っていても ransomware。委託先・取引先・提供元で起きた事故でも、攻撃の中身が暗号化・身代金要求・業務停止なら ransomware（被害を受けた側は victim の項目で選ぶ）。個人情報や顧客データの漏えいが記事の主題でも、暗号化や身代金要求（脅迫文）が書かれているなら ransomware で、持ち出しは段階（収集・持ち出し）で表す。例：「保守委託先のサーバが暗号化され、預かっていた個人情報が漏えいした」は ransomware（victim は vendor）
    day0:
      kind: business_stop
      labelJa: 侵入され、社内のシステムが暗号化される
      sourceJa: 判定した攻撃経路
    stopsOperations: true
  - id: bec
    labelJa: なりすまし送金（ビジネスメール詐欺）
    shortJa: なりすまし・送金詐欺
    readingHintJa: 社長・役員・取引先などになりすました送金指示（メール、チャット、SNS、電話を問わない）で資金を送金させる詐欺。送金（金額）が主な被害のもの。メールアカウントの乗っ取りを伴っていても、被害が送金なら bec。送金が目的でなく、乗っ取ったアカウントから取引先へ不審なメールが送られる（取引先への踏み台・二次被害）ものは account_takeover
    day0:
      kind: money
      labelJa: なりすましの指示で送金してしまう
      showMoneyLoss: true
    reachesMoney: true
    stopsOperations: false
  - id: account_takeover
    labelJa: メールアカウントの乗っ取り（取引先への踏み台）
    shortJa: メールアカウントの乗っ取り・取引先への二次被害
    readingHintJa: 取引先などを装ったフィッシングでメールアカウントを乗っ取られ、そのアカウントから取引先へ不審なメールが送られる（取引先への踏み台・二次被害になる）もの。送金（金額）が主な被害なら bec、情報の流出が主な被害なら data_breach
    day0:
      kind: partner
      labelJa: 乗っ取られたアカウントから取引先へ不審なメールが送られる
      sourceJa: 判定した攻撃経路
    stopsOperations: false
  - id: data_breach
    labelJa: 情報漏えい
    shortJa: 情報漏えい
    readingHintJa: 外部の攻撃者による不正アクセス（脆弱性の悪用、認証情報の悪用、Web サイトの改ざん）やクラウドの公開設定の誤りで、顧客・従業員などの情報が外部に出たもの。ただし暗号化や身代金要求が書かれているものは、情報が漏れていても ransomware
    day0:
      kind: legal
      labelJa: 個人情報の流出が発覚する
    stopsOperations: false
  - id: partner_outage
    labelJa: 取引先・提供元の停止（もらい事故）
    shortJa: 取引先・提供元の停止による業務停止
    readingHintJa: 記事の会社自身のシステムは侵入されておらず、取引先・委託先・クラウドやシステムの提供元が被害（ランサムウェア、サービスの停止、障害）を受けたために、記事の会社の業務やサービス（ネットストア、出荷、受付など）が止まったもの。記事の会社が「取引先の被害の影響で停止した」と書いているときの分類。提供元のシステム障害・不具合のように、外部の攻撃者がいない停止でも、記事の会社・自治体などのサービスが提供元の停止で止まったものはこの分類（対象外にしない）。取引先自身の被害の中身（何が暗号化されたか）を主に書いた記事、記事の会社のシステムも暗号化されたものは ransomware。取引先に預けた情報が漏れたものは data_breach
    day0:
      kind: business_stop
      labelJa: 取引先・提供元が止まり、自社の業務も止まる
      sourceJa: 判定した経路（取引先・提供元の停止）
    stopsOperations: true
    reportsPersonalData: false
    # 御社が侵入された事故ではないので、入口が無いとき（外部の提供元に頼る業務が無いカルテ）に「攻撃の入口」とは言わない
    noEntry:
      headlineJa: 御社は侵入されていません。取引先・提供元が止まっても、カルテの範囲では業務は止まりません
      shortJa: 止まる業務なし
      noteJa: これは御社が侵入された事故ではなく、取引先・提供元の停止です。御社のカルテには、その停止で止まる業務（外部の提供元に頼る業務）がありません。提供元に任せているシステムがあるのに登録していないときは、カルテに足して、判定をやり直してください。
      timelineJa: 取引先・提供元の停止で止まる業務がカルテに無いため、業務への影響と期限は発生しません

# 被害の種類
# 型紙（templates/*.yaml）の damageType は、ここの id を指す。1 つの種類に型紙を複数持てる。
# 新しい攻撃を足すときは、ここに 1 件足し、型紙・判定ルール・（必要なら）役割を足す。コードは変えない。
# out_of_scope（攻撃経路では判定できない事故）は組み込みなので、ここには書かない。
#
# id：英小文字・数字・アンダースコア。型紙の damageType、会社の評価データ、読解の出力に使う
# labelJa：画面に出す名前
# shortJa：Claude への出力指示で使う短い言い方（「〜=○○」の形で並べる）
# readingHintJa：Claude が記事を読むときの分類基準。他の種類との境目が分かるように書く
# day0：時間軸の最初に置く出来事（発覚日）。showMoneyLoss は、送金額の目安を添える
# reachesMoney：到達すると送金額の目安を出す種類（なりすまし送金など）
# stopsOperations：経路が資産に届いたとき、依存する業務が止まる種類か。省略すると true（止まる）。
#   false にすると、止まる業務・復旧日数・売上影響を出さない（取引先への影響日もそこから出るので出ない）。
#   個人情報の報告・通知などの期限、送金額の目安は、そのまま出す。false の種類の day0 は business_stop にしない
# 型紙に紐づかない経路（AI 攻撃者の経路）は種類が決まらないので、先頭の種類の day0 を使う
damageTypes:
  - id: ransomware
    labelJa: 業務停止（ランサムウェア）
    shortJa: 暗号化・業務停止
    readingHintJa: ランサムウェアによる暗号化・業務停止。データの持ち出しやリークサイトでの公開（二重恐喝）を伴っていても ransomware
    day0:
      kind: business_stop
      labelJa: 侵入され、社内のシステムが暗号化される
      sourceJa: 判定した攻撃経路
    stopsOperations: true
  - id: bec
    labelJa: なりすまし送金（ビジネスメール詐欺）
    shortJa: なりすまし・送金詐欺
    readingHintJa: 社長・役員・取引先などになりすました送金指示（メール、チャット、SNS、電話を問わない）で資金を送金させる詐欺。送金（金額）が主な被害のもの。メールアカウントの乗っ取りを伴っていても、被害が送金なら bec。送金が目的でなく、乗っ取ったアカウントから取引先へ不審なメールが送られる（取引先への踏み台・二次被害）ものは account_takeover
    day0:
      kind: money
      labelJa: なりすましの指示で送金してしまう
      showMoneyLoss: true
    reachesMoney: true
    stopsOperations: false
  - id: account_takeover
    labelJa: メールアカウントの乗っ取り（取引先への踏み台）
    shortJa: メールアカウントの乗っ取り・取引先への二次被害
    readingHintJa: 取引先などを装ったフィッシングでメールアカウントを乗っ取られ、そのアカウントから取引先へ不審なメールが送られる（取引先への踏み台・二次被害になる）もの。送金（金額）が主な被害なら bec、情報の流出が主な被害なら data_breach
    day0:
      kind: partner
      labelJa: 乗っ取られたアカウントから取引先へ不審なメールが送られる
      sourceJa: 判定した攻撃経路
    stopsOperations: false
  - id: data_breach
    labelJa: 情報漏えい
    shortJa: 情報漏えい
    readingHintJa: 外部の攻撃者による不正アクセス（脆弱性の悪用、認証情報の悪用、Web サイトの改ざん）やクラウドの公開設定の誤りで、顧客・従業員などの情報が外部に出たもの
    day0:
      kind: legal
      labelJa: 個人情報の流出が発覚する
    stopsOperations: false

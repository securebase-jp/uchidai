# 悪用確認済み脆弱性（CISA KEV）との突き合わせに使う製品の対応表と、版の範囲表。
#
# - products[].aliases：担当者の自由入力（表記ゆれ、カタカナ）を製品に当てる別名。正規化（NFKC・小文字・空白とハイフンを除く）して部分一致
# - products[].kev：KEV カタログの vendorProject（完全一致、大小無視）と product（正規表現）。該当する KEV の CVE をすべて拾う
# - products[].kevCves：product 名が「Multiple Products」などで拾えない CVE を明示的に足す
# - products[].versionScheme：版の比較の仕方。dotted（7.0.14、14.1-43.56、22.7R2.5、6.5.4.14-109n など数字と英字の並び）、
#   r-release（Check Point の R81.10 のように R で始まる。R が無くても受け付ける）
# - products[].ranges：ベンダーの公表資料（PSIRT）で自分で確認できた、影響を受ける版の範囲。from/to は両端を含む。below は含まない上限。
#   authBypass は「認証を経ずに悪用できる（多要素認証では止まらない）か」。確認できないときは書かない
# - products[].unverified：KEV にあるが版の範囲を確認できていない CVE の注記（書かなくても、ranges に無い KEV の CVE は「範囲は未確認」になる）
#
# 範囲表に無い CVE が KEV にある限り「該当しない」は「確認した範囲では該当しない」の意味。判定（knownExploited）はプログラムが決める
checkedAt: "2026-11-03"

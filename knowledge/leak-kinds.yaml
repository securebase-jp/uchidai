# 漏えいした情報の種類（記事が書く、漏えいした・漏えいの可能性があるとした情報の種類）
# 読解が Case の leakedData に付け、一枚に、種類ごとの強い案内を固定の文で出す。会社カルテの個人情報（件数）の計算とは別で、
# 記事の情報の種類を使って「御社が同じ種類の情報を預かっているなら」と書く（第三者の事故のときは「預けている情報に含まれるなら」）。
# 新しい種類は、ここに 1 件足すだけで、読解の選択肢と一枚に効く（コードの変更なし）
#
# id：英小文字・数字・ハイフン
# labelJa：画面と一枚に出す名前
# readingHintJa：Claude が記事を読むときの分類基準
# noteJa：その種類のときに御社がすること・報告の扱い。断定しすぎず、確認が必要なものは「確認が必要」と書く
# sourceIds：根拠（knowledge/sources.yaml の id）
kinds:
  - id: sensitive
    labelJa: 要配慮個人情報（病歴など）
    readingHintJa: 病歴・診療情報、障害、犯罪歴など、要配慮個人情報にあたる情報（患者・利用者の診療記録を含む）
    noteJa: 件数にかかわらず、個人情報保護委員会への報告の対象になります（規則第7条第1号）。本人への通知も要ります。
    sourceIds: [ppc-guidelines]
  - id: payment
    labelJa: 決済情報（クレジットカード番号など）
    readingHintJa: クレジットカード番号、有効期限、セキュリティコード、決済サービスの認証情報など、決済に使う情報
    noteJa: 不正に利用されるおそれがあるため、カード会社・決済代行会社と警察へ連絡してください。個人情報保護委員会への報告の対象になることがあります。確認が必要です。
    sourceIds: [ppc-guidelines, npa-soudan]
  - id: identity
    labelJa: 本人確認書類（運転免許証・マイナンバーなど）
    readingHintJa: 運転免許証、パスポート、マイナンバー、住民票など、本人確認に使う書類の情報や画像
    noteJa: なりすましに悪用されるおそれがあります。本人への通知と警察への相談を急ぎ、個人情報保護委員会への報告が必要かを確認してください。
    sourceIds: [ppc-guidelines, npa-soudan]

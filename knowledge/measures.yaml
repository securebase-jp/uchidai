# 対策ボタン。patches は役割で資産を特定し、緩和策の有無と属性を書き換える（根拠は担当者登録）
# 費用の目安は出典を確認できた項目だけ入れる。無い項目は「ベンダーの見積もり待ち」と表示する
measures:
  - id: vpn-mfa
    labelJa: VPN に多要素認証
    mitigation: M1032
    patches:
      - role: entry.vpn
        mitigation: M1032
        status: present
    requestToJa: 保守ベンダー
  - id: vpn-update
    labelJa: VPN 装置の更新
    mitigation: M1051
    patches:
      - role: entry.vpn
        mitigation: M1051
        status: present
        attrs: { knownExploited: false, authBypass: false }
    requestToJa: 保守ベンダー
  - id: backup-isolated
    labelJa: 切り離したバックアップ
    mitigation: M1053
    patches:
      - role: backup
        mitigation: M1053
        status: present
        attrs: { method: isolated, isolated: true, restoreTested: true }
    requestToJa: 保守ベンダー
  - id: exec-mfa
    labelJa: 社長にも多要素認証
    mitigation: M1032
    patches:
      - role: cloud.mail_account.exec
        mitigation: M1032
        status: present
        attrs: { mfaException: false }
    requestToJa: 情シス担当者（設定変更）
  - id: transfer-callback
    labelJa: 送金時の折り返し確認ルール
    mitigation: UD-01
    patches:
      - role: person.accounting
        mitigation: UD-01
        status: present
    requestToJa: 経理・社長（社内ルール）
  - id: vendor-remote-harden
    labelJa: 保守接続に多要素認証と必要時のみ有効化
    mitigation: M1032
    patches:
      - role: entry.vendor_remote
        mitigation: M1032
        status: present
      - role: entry.vendor_remote
        mitigation: UD-02
        status: present
        attrs: { alwaysOn: false }
    requestToJa: 保守ベンダー
  - id: edr
    labelJa: EDR の導入と監視
    mitigation: M1040
    patches:
      - role: admin
        mitigation: M1040
        status: present
        attrs: { monitored: true }
      - role: pc
        mitigation: M1040
        status: present
    # 費用の目安は knowledge/costs.yaml（measureId: edr）
    requestToJa: 保守ベンダー
  - id: admin-separate
    labelJa: 管理者パスワードを PC ごとに個別化
    mitigation: M1026
    patches:
      - role: admin
        mitigation: M1026
        status: present
    requestToJa: 保守ベンダー
  - id: saas-sharing-review
    labelJa: クラウドサービスの共有・権限設定を制限し、棚卸しする
    mitigation: M1022
    patches:
      - role: cloud.saas
        mitigation: M1022
        status: present
        attrs: { sharingRestricted: true }
      - role: cloud.saas
        mitigation: M1047
        status: present
        attrs: { reviewCadence: quarterly }
    requestToJa: 情シス担当者（設定変更と棚卸し）
  - id: staff-mfa
    labelJa: 社員のメールにも多要素認証
    mitigation: M1032
    patches:
      - role: cloud.mail_account.staff
        mitigation: M1032
        status: present
        attrs: { mfaException: false }
    requestToJa: 情シス担当者（設定変更）
  - id: session-conditions
    labelJa: メールのログインに接続元・端末の条件と、セッションの有効期間の短縮
    mitigation: M1036
    patches:
      - role: cloud.mail_account.staff
        mitigation: M1036
        status: present
      - role: cloud.mail_account.exec
        mitigation: M1036
        status: present
    requestToJa: 情シス担当者（設定変更）
  - id: mail-forward-audit
    labelJa: メールの転送ルールの点検
    mitigation: M1047
    patches:
      - role: cloud.mail_account.staff
        mitigation: M1047
        status: present
    requestToJa: 情シス担当者（設定の点検）
  - id: partner-warning-procedure
    labelJa: 異変に気づいたら取引先へ速やかに知らせる手順
    mitigation: UD-03
    patches:
      - role: cloud.mail_account.staff
        mitigation: UD-03
        status: present
    requestToJa: 総務・営業（社内ルール）
  - id: rdp-close
    labelJa: リモートデスクトップを外部に公開しない（VPN を通す）
    mitigation: M1042
    patches:
      - role: entry.rdp
        mitigation: M1042
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-mfa
    labelJa: リモートデスクトップに多要素認証
    mitigation: M1032
    patches:
      - role: entry.rdp
        mitigation: M1032
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-restrict-source
    labelJa: リモートデスクトップの接続元を限定
    mitigation: M1035
    patches:
      - role: entry.rdp
        mitigation: M1035
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-disable-unused
    labelJa: 使っていない端末の遠隔接続を止める
    mitigation: M1042
    patches:
      - role: entry.rdp
        mitigation: M1042
        status: present
    requestToJa: 情シス担当者
  - id: web-update
    labelJa: ホームページの CMS・追加機能・PHP の版を更新する
    mitigation: M1051
    patches:
      - role: entry.web
        mitigation: M1051
        status: present
        attrs: { knownExploited: false }
    requestToJa: ホームページの制作・保守会社
  - id: web-admin-mfa
    labelJa: ホームページの管理画面に多要素認証
    mitigation: M1032
    patches:
      - role: entry.web
        mitigation: M1032
        status: present
    requestToJa: ホームページの制作・保守会社
  - id: web-tamper-detect
    labelJa: ホームページの改ざん検知
    mitigation: M1047
    patches:
      - role: entry.web
        mitigation: M1047
        status: present
    requestToJa: ホームページの制作・保守会社
  - id: web-service-mfa
    labelJa: 会員・顧客向けのログインに多要素認証（追加認証）
    mitigation: UD-08
    patches:
      - role: entry.web
        mitigation: UD-08
        status: present
    requestToJa: 会員サイトの開発・運用会社
  - id: web-service-login-limit
    labelJa: 会員向けのログイン試行の回数・接続元を制限
    mitigation: M1036
    patches:
      - role: entry.web
        mitigation: M1036
        status: present
    requestToJa: 会員サイトの開発・運用会社
  - id: web-service-reuse-notice
    labelJa: 会員へパスワードの使い回しを注意喚起し、漏えい済みパスワードを拒否
    mitigation: UD-09
    patches:
      - role: entry.web
        mitigation: UD-09
        status: present
    requestToJa: 会員サイトの運営担当者（案内）と開発・運用会社（拒否の設定）
  - id: service-account-key-hygiene
    labelJa: API キーをコードや設定ファイルに書かず、定期的に更新し、流出を検知する
    mitigation: UD-11
    patches:
      - role: cloud.saas
        mitigation: UD-11
        status: present
    requestToJa: 情シス担当者と、連携システムの開発・運用会社
  - id: service-account-least-privilege
    labelJa: API キー・連携用アカウントの権限を絞り、使わないものを失効する
    mitigation: UD-10
    patches:
      - role: cloud.saas
        mitigation: UD-10
        status: present
    requestToJa: 情シス担当者と、連携システムの開発・運用会社
  - id: storage-sharing-review
    labelJa: クラウドストレージの公開共有を禁止し、棚卸しする
    mitigation: M1022
    patches:
      - role: cloud.storage
        mitigation: M1022
        status: present
        attrs: { publicLinksDisabled: true }
      - role: cloud.storage
        mitigation: M1047
        status: present
        attrs: { reviewCadence: quarterly }
    requestToJa: 情シス担当者（設定変更と棚卸し）
  # --- 委託先管理（助言）。会社カルテの資産には書き込まず、判定には使わない。第三者の事故のときに一枚へ出す（victims.yaml の measureIds） ---
  - id: vendor-contract-review
    labelJa: 委託先との契約を見直す（安全管理措置、再委託の事前承認、事故時の連絡義務）
    mitigation: UD-04
    patches: []
    requestToJa: 総務・法務
  - id: vendor-data-inventory
    labelJa: 委託先に預けている個人データ・重要データを洗い出し、最小限にする
    mitigation: UD-04
    patches: []
    requestToJa: 総務・各部門の責任者
  - id: vendor-return-delete
    labelJa: 不要になったデータの返却・削除を委託先に確認する
    mitigation: UD-04
    patches: []
    requestToJa: 総務・法務
  - id: vendor-incident-contact
    labelJa: 委託先の事故連絡窓口と連絡手順を決める
    mitigation: UD-04
    patches: []
    requestToJa: 総務・情シス担当者
  - id: vendor-audit
    labelJa: 委託先の個人データの取扱状況を、定期的に確認する（チェックリスト・報告）
    mitigation: UD-04
    patches: []
    requestToJa: 総務・法務
  # --- SNS・チャットで社長や取引先を名乗って接触される手口（TRIAL-B-006）。社内の運用や設定で、外部費用はかからない ---
  - id: sns-group-refuse
    labelJa: SNS・チャットのグループ作成の依頼に応じない運用
    mitigation: UD-05
    patches:
      - role: person.accounting
        mitigation: UD-05
        status: present
    requestToJa: 経理・社長（社内ルール）
  - id: transfer-dual-approval
    labelJa: 送金の二重承認
    mitigation: UD-06
    patches:
      - role: person.accounting
        mitigation: UD-06
        status: present
    requestToJa: 経理・社長（社内ルール）
  - id: transfer-limit
    labelJa: 一人で送金できる上限額の設定
    mitigation: UD-07
    patches:
      - role: person.accounting
        mitigation: UD-07
        status: present
    requestToJa: 経理・社長（社内ルール）、ネットバンキングの設定
  # --- ランサムウェアの任意の枝（永続化・遠隔操作・ログ消去。TRIAL-R-005）。記事にその段階があるときだけ並ぶ ---
  - id: admin-account-monitor
    labelJa: 管理者アカウントの作成・変更の監視と棚卸し
    mitigation: M1047
    patches:
      - role: admin
        mitigation: M1047
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: egress-restrict
    labelJa: サーバからの外向き通信を許可した宛先に限る
    mitigation: M1037
    patches:
      - role: server
        mitigation: M1037
        status: present
    requestToJa: 保守ベンダー
  - id: log-offsite
    labelJa: ログを別の場所にも保管する
    mitigation: M1029
    patches:
      - role: server
        mitigation: M1029
        status: present
    requestToJa: 保守ベンダー

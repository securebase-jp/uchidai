# 対策ボタン。patches は役割で資産を特定し、緩和策の有無と属性を書き換える（根拠は担当者登録）
# 費用の目安は出典を確認できた項目だけ入れる。無い項目は「ベンダーの見積もり待ち」と表示する
measures:
  - id: vpn-mfa
    labelJa: VPN に多要素認証
    mitigation: M1032
    patches:
      - role: entry.vpn
        mitigation: M1032
        status: present
    requestToJa: 保守ベンダー
  - id: vpn-update
    labelJa: VPN 装置の更新
    mitigation: M1051
    patches:
      - role: entry.vpn
        mitigation: M1051
        status: present
        attrs: { knownExploited: false, authBypass: false }
    requestToJa: 保守ベンダー
  - id: backup-isolated
    labelJa: 切り離したバックアップ
    mitigation: M1053
    patches:
      - role: backup
        mitigation: M1053
        status: present
        attrs: { method: isolated, isolated: true, restoreTested: true }
    requestToJa: 保守ベンダー
  - id: exec-mfa
    labelJa: 社長にも多要素認証
    mitigation: M1032
    patches:
      - role: cloud.mail_account.exec
        mitigation: M1032
        status: present
        attrs: { mfaException: false }
    requestToJa: 情シス担当者（設定変更）
  - id: transfer-callback
    labelJa: 送金時の折り返し確認ルール
    mitigation: UD-01
    patches:
      - role: person.accounting
        mitigation: UD-01
        status: present
    requestToJa: 経理・社長（社内ルール）
  - id: vendor-remote-harden
    labelJa: 保守接続に多要素認証と必要時のみ有効化
    mitigation: M1032
    patches:
      - role: entry.vendor_remote
        mitigation: M1032
        status: present
      - role: entry.vendor_remote
        mitigation: UD-02
        status: present
        attrs: { alwaysOn: false }
    requestToJa: 保守ベンダー
  - id: edr
    labelJa: EDR の導入と監視
    mitigation: M1040
    patches:
      - role: admin
        mitigation: M1040
        status: present
        attrs: { monitored: true }
      - role: pc
        mitigation: M1040
        status: present
    # 費用の目安は knowledge/costs.yaml（measureId: edr）
    requestToJa: 保守ベンダー
  - id: admin-separate
    labelJa: 管理者パスワードを PC ごとに個別化
    mitigation: M1026
    patches:
      - role: admin
        mitigation: M1026
        status: present
    requestToJa: 保守ベンダー
  - id: saas-sharing-review
    labelJa: クラウドサービスの共有・権限設定を制限し、棚卸しする
    mitigation: M1022
    patches:
      - role: cloud.saas
        mitigation: M1022
        status: present
        attrs: { sharingRestricted: true }
      - role: cloud.saas
        mitigation: M1047
        status: present
        attrs: { reviewCadence: quarterly }
    requestToJa: 情シス担当者（設定変更と棚卸し）
  - id: staff-mfa
    labelJa: 社員のメールにも多要素認証
    mitigation: M1032
    patches:
      - role: cloud.mail_account.staff
        mitigation: M1032
        status: present
        attrs: { mfaException: false }
    requestToJa: 情シス担当者（設定変更）
  - id: mail-forward-audit
    labelJa: メールの転送ルールの点検
    mitigation: M1047
    patches:
      - role: cloud.mail_account.staff
        mitigation: M1047
        status: present
    requestToJa: 情シス担当者（設定の点検）
  - id: partner-warning-procedure
    labelJa: 異変に気づいたら取引先へ速やかに知らせる手順
    mitigation: UD-03
    patches:
      - role: cloud.mail_account.staff
        mitigation: UD-03
        status: present
    requestToJa: 総務・営業（社内ルール）
  - id: rdp-close
    labelJa: リモートデスクトップを外部に公開しない（VPN を通す）
    mitigation: M1042
    patches:
      - role: entry.rdp
        mitigation: M1042
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-mfa
    labelJa: リモートデスクトップに多要素認証
    mitigation: M1032
    patches:
      - role: entry.rdp
        mitigation: M1032
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-restrict-source
    labelJa: リモートデスクトップの接続元を限定
    mitigation: M1035
    patches:
      - role: entry.rdp
        mitigation: M1035
        status: present
    requestToJa: 情シス担当者・保守ベンダー
  - id: rdp-disable-unused
    labelJa: 使っていない端末の遠隔接続を止める
    mitigation: M1042
    patches:
      - role: entry.rdp
        mitigation: M1042
        status: present
    requestToJa: 情シス担当者
  - id: web-update
    labelJa: ホームページの CMS・追加機能を更新する
    mitigation: M1051
    patches:
      - role: entry.web
        mitigation: M1051
        status: present
        attrs: { knownExploited: false }
    requestToJa: ホームページの制作・保守会社
  - id: web-admin-mfa
    labelJa: ホームページの管理画面に多要素認証
    mitigation: M1032
    patches:
      - role: entry.web
        mitigation: M1032
        status: present
    requestToJa: ホームページの制作・保守会社
  - id: web-tamper-detect
    labelJa: ホームページの改ざん検知
    mitigation: M1047
    patches:
      - role: entry.web
        mitigation: M1047
        status: present
    requestToJa: ホームページの制作・保守会社
  - id: storage-sharing-review
    labelJa: クラウドストレージの公開共有を禁止し、棚卸しする
    mitigation: M1022
    patches:
      - role: cloud.storage
        mitigation: M1022
        status: present
        attrs: { publicLinksDisabled: true }
      - role: cloud.storage
        mitigation: M1047
        status: present
        attrs: { reviewCadence: quarterly }
    requestToJa: 情シス担当者（設定変更と棚卸し）

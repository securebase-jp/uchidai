# 判定ルール表：連携用アカウント・API キー（cloud.saas）の乗っ取り
# 型紙 service-account-takeover の各段階。役割は data-breach-saas.yaml と同じクラウドサービス（cloud.saas）だが、判定の中身が違うので、
# stages で段階を指定して分ける（共有設定の誤りの対策 M1022・M1047 と混ぜない）。
# 鍵には追加認証（多要素認証）が無いので、M1032 は効かない。対策は「鍵の保管・更新・流出の検知」と「権限の最小化と棚卸し」
rules:
  - id: service_account.login
    role: cloud.saas
    stages: [sa-login]
    techniques: [T1078.004, T1552, T1552.001, T1528, T1550.001]
    materialsJa: カルテ：API キー・連携用アカウントの保管場所（コード・設定ファイルに書かない）、定期的な更新、流出の検知
    mitigations: [UD-11]
    ineffective:
      - mitigation: M1032
        reasonJa: API キーや連携用アカウントには多要素認証が無く、キーが漏れればそのまま使われます
    outcomes:
      - state: recoverable
        when: { control: { mitigation: UD-11, status: present } }
        reasonJa: キーの保管場所を限り、定期的に更新し、流出を検知できる。漏れても、気づいて失効するまでの期間を短くできる（漏れること自体は防げない）
      - state: unknown
        when: { control: { mitigation: UD-11, status: unknown } }
        reasonJa: キーの保管・更新・流出の検知が未確認
      - state: breached
        reasonJa: キーがコードや設定ファイルに書かれ、更新も流出の検知もなければ、漏れたキーはそのまま使われ、気づくのも遅れる
  - id: service_account.access
    role: cloud.saas
    stages: [sa-access]
    techniques: [T1213]
    materialsJa: カルテ：API キー・連携用アカウントに付けた権限の範囲、使われていないキーの棚卸し
    mitigations: [UD-10]
    outcomes:
      - state: recoverable
        when: { control: { mitigation: UD-10, status: present } }
        reasonJa: キーの権限が必要な範囲に絞られ、使われないキーは失効している。漏れても、取得できる情報は限られる
      - state: unknown
        when: { control: { mitigation: UD-10, status: unknown } }
        reasonJa: キーの権限の範囲や棚卸しが未確認
      - state: breached
        reasonJa: キーの権限が広い、または使われないキーが残っていれば、漏れたキーでクラウド上の多くの情報を取得される
  - id: service_account.exfil
    role: cloud.saas
    stages: [sa-exfil]
    techniques: [T1537, T1567, T1048, T1041]
    materialsJa: ―
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 取得した情報は、クラウドの外へ持ち出される（この段階で止める対策は会社側にない。止めるのは接続と権限の段階）

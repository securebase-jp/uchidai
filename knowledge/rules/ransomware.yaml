# 判定ルール表：業務停止（被害事例1）
# 条件式：all / any / not / control {mitigation, status} / attr {key, equals | missing} / always
# outcomes は上から順に評価し、最初に一致した状態を採用する。when の無い行は既定
rules:
  - id: ransomware.entry.vpn
    role: entry.vpn
    techniques: [T1190]
    materialsJa: 外部確認：VPN装置の露出。カルテ：製品・バージョン、更新の運用
    mitigations: [M1042, M1051]
    ineffective:
      # 公開アプリの脆弱性を突く侵入（T1190）は認証そのものを回避するので、多要素認証は効かない。
      # 認証を回避しない脆弱性だと分かっているとき（attrs.authBypass = false）だけ例外にする
      - mitigation: M1032
        when: { not: { attr: { key: authBypass, equals: false } } }
        reasonJa: 公開アプリの脆弱性を突く侵入は認証そのものを回避するため、多要素認証では止まりません
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1042, status: present } }
        reasonJa: VPN装置を外部に公開していない
      - state: breached
        when: { attr: { key: knownExploited, equals: true } }
        reasonJa: 製品・バージョンが悪用確認済みの脆弱性に該当する
      - state: blocked
        when: { control: { mitigation: M1051, status: present } }
        reasonJa: 更新の運用があり、悪用確認済みの脆弱性に該当しない
      - state: unknown
        when:
          any:
            - control: { mitigation: M1051, status: unknown }
            - attr: { key: version, missing: true }
        reasonJa: バージョンまたは更新の運用が未確認
      - state: breached
        reasonJa: 更新の運用がなく、脆弱性が残っている
  - id: ransomware.entry.vpn-credentials
    role: entry.vpn
    # 脆弱性ではなく、流出・推測したパスワードで VPN に正規ログインする侵入
    techniques: [T1133, T1078]
    materialsJa: カルテ：VPN 接続の多要素認証、パスワードの使い回し防止策。外部確認：VPN装置の露出
    mitigations: [M1042, M1032, M1027]
    ineffective:
      - mitigation: M1051
        reasonJa: 正規の認証情報でログインされるため、装置を更新していても止まりません
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1042, status: present } }
        reasonJa: VPN装置を外部に公開していない
      - state: blocked
        when: { control: { mitigation: M1032, status: present } }
        reasonJa: 認証情報での侵入には多要素認証が効く（脆弱性を突く侵入とは逆で、ここでは止まる）
      - state: unknown
        when: { control: { mitigation: M1032, status: unknown } }
        reasonJa: VPN 接続の多要素認証の有無が未確認
      - state: breached
        reasonJa: 流出・推測されたパスワードだけで VPN にログインできる（更新していても止まらない）
  - id: ransomware.entry.rdp
    role: entry.rdp
    # 公開されたリモートデスクトップへの接続（T1133、T1021.001）と、流出・推測したパスワードでの正規ログイン（T1078）
    techniques: [T1133, T1021.001, T1078]
    materialsJa: 外部確認：リモートデスクトップの露出（MVP では対象外）。カルテ：公開の有無、多要素認証、接続元の制限
    mitigations: [M1042, M1032, M1035]
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1042, status: present } }
        reasonJa: リモートデスクトップを外部に公開していない
      - state: blocked
        when:
          all:
            - control: { mitigation: M1032, status: present }
            - control: { mitigation: M1035, status: present }
        reasonJa: 多要素認証があり、接続元も限定されている
      - state: unknown
        when:
          any:
            - control: { mitigation: M1042, status: unknown }
            - control: { mitigation: M1032, status: unknown }
        reasonJa: 公開の有無または多要素認証が未確認
      - state: breached
        reasonJa: 公開されたリモートデスクトップにパスワードだけで入れる
  # 公開ホームページ（entry.web）の入口は knowledge/rules/web.yaml（情報漏えいの型紙と共通）
  - id: ransomware.entry.phishing
    role: pc
    techniques: [T1566, T1566.001, T1566.002, T1204]
    materialsJa: カルテ：EDR の有無、研修
    mitigations: [M1040, M1049]
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1040, status: present } }
        reasonJa: 端末の振る舞い防御（EDR）で実行が止まる
      - state: human
        when: { control: { mitigation: M1017, status: present } }
        reasonJa: 研修はあるが、だまされても仕組みで止まる手順がない
      - state: unknown
        when: { control: { mitigation: M1040, status: unknown } }
        reasonJa: EDR の有無が未確認
      - state: breached
        reasonJa: 添付ファイルやリンクを開けば実行される
  - id: ransomware.credentials
    role: admin
    techniques: [T1003, T1078, T1110]
    materialsJa: カルテ：EDR の有無と監視体制、管理者アカウントの分離
    mitigations: [M1040, M1026]
    outcomes:
      - state: blocked
        when:
          all:
            - control: { mitigation: M1040, status: present }
            - not: { attr: { key: monitored, equals: false } }
            - control: { mitigation: M1026, status: present }
        reasonJa: EDR のアラートを見る体制があり、管理者アカウントが分離されている
      - state: breached
        when: { control: { mitigation: M1026, status: absent } }
        reasonJa: 管理者パスワードが全 PC で共通なので、1 台から奪った権限で全体に広がる
      - state: unknown
        when:
          any:
            - control: { mitigation: M1040, status: unknown }
            - control: { mitigation: M1026, status: unknown }
            - attr: { key: monitored, equals: false }
        reasonJa: EDR の有無・監視体制・管理者アカウントの分離が未確認
      - state: breached
        reasonJa: 管理者権限を奪う手口を止める仕組みがない
  # --- 任意の枝の段階（TRIAL-R-005）。記事に書かれたときだけ経路に入る。止まっても暗号化の本線は進む ---
  - id: ransomware.persist
    role: admin
    techniques: [T1136, T1136.001, T1136.002, T1136.003, T1098]
    materialsJa: カルテ：管理者アカウントの作成・変更の監視と、定期的な棚卸し
    mitigations: [M1047]
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1047, status: present } }
        reasonJa: 管理者アカウントの作成・変更を監視し、定期的に棚卸ししているので、攻撃者用のアカウントを作られても早く見つかる
      - state: unknown
        when: { control: { mitigation: M1047, status: unknown } }
        reasonJa: 管理者アカウントの監視と棚卸しが未確認
      - state: breached
        reasonJa: 管理者アカウントの作成を見張る仕組みがなく、攻撃者用のアカウントを作られても気づけない
  - id: ransomware.lateral
    role: server
    techniques: [T1021, T1021.001, T1021.002]
    materialsJa: カルテ：業務サーバ区画の分離、管理用通信の制限
    mitigations: [M1030, M1035]
    outcomes:
      - state: blocked
        when:
          all:
            - control: { mitigation: M1030, status: present }
            - control: { mitigation: M1035, status: present }
        reasonJa: 業務サーバが PC と別区画で、管理用通信が限定されている
      - state: unknown
        when:
          all:
            - control: { mitigation: M1030, status: present }
            - control: { mitigation: M1035, status: unknown }
        reasonJa: 区画は分かれているが、通信ルールが未確認
      - state: unknown
        when: { control: { mitigation: M1030, status: unknown } }
        reasonJa: 区画の分離が未確認
      - state: breached
        reasonJa: 業務サーバと PC が同じネットワークにある
  - id: ransomware.discover
    role: server
    techniques: [T1018, T1082, T1087, T1087.002, T1135, T1046, T1069, T1016]
    materialsJa: ―（予防では止められない段階。侵入と権限の奪取の段階で止める）
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 社内のサーバや共有を調べる動きは、正規の操作に紛れるので止められない。止めるのは、侵入と管理者権限を奪う段階
  - id: ransomware.remote
    role: server
    techniques: [T1219, T1219.002]
    materialsJa: カルテ：サーバからの外向き通信の制限
    mitigations: [M1037]
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1037, status: present } }
        reasonJa: サーバからの外向きの通信を許可した宛先に限っているので、仕込まれた遠隔操作ツールが外と通信できない
      - state: unknown
        when: { control: { mitigation: M1037, status: unknown } }
        reasonJa: サーバからの外向き通信の制限が未確認
      - state: breached
        reasonJa: サーバから外への通信を限っておらず、遠隔操作ツールが外から操作される
  - id: ransomware.evade
    role: server
    techniques: [T1070, T1070.004, T1070.006, T1685, T1685.001, T1685.005]
    materialsJa: カルテ：ログの別保管
    mitigations: [M1029]
    outcomes:
      - state: blocked
        when: { control: { mitigation: M1029, status: present } }
        reasonJa: ログを別の場所にも保管しているので、サーバのログを消されても記録が残り、痕跡を隠せない
      - state: unknown
        when: { control: { mitigation: M1029, status: unknown } }
        reasonJa: ログの別保管が未確認
      - state: breached
        reasonJa: ログがサーバの中にしかなく、消されると何が起きたか追えなくなる
  - id: ransomware.recovery
    role: backup
    techniques: [T1490]
    materialsJa: カルテ：バックアップの方式と保管場所、復旧テストの有無
    mitigations: [M1053]
    outcomes:
      - state: recoverable
        when:
          all:
            - control: { mitigation: M1053, status: present }
            - attr: { key: isolated, equals: true }
            - attr: { key: restoreTested, equals: true }
        reasonJa: 切り離した保管先があり、復旧テスト済み
      - state: unknown
        when:
          all:
            - not: { control: { mitigation: M1053, status: absent } }
            - attr: { key: isolated, equals: true }
            - not: { attr: { key: restoreTested, equals: true } }
        reasonJa: 切り離した保管先はあるが、復旧テストが未実施
      - state: unknown
        when: { control: { mitigation: M1053, status: unknown } }
        reasonJa: バックアップの方式が未確認
      - state: breached
        reasonJa: 社内ネットワークやクラウド同期から切り離された保管先がなく、バックアップごと暗号化される
  - id: core.reached
    role: core
    techniques: []
    materialsJa: ―
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 中核システムに到達。業務影響を計算する

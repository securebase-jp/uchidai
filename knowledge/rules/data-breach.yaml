# 判定ルール表：情報漏えい（被害事例2）
rules:
  - id: data_breach.storage
    role: cloud.storage
    techniques: [T1530]
    materialsJa: カルテ：共有範囲のルール、公開設定の制限、定期的な棚卸し
    mitigations: [M1022, M1047]
    outcomes:
      - state: blocked
        when:
          all:
            - control: { mitigation: M1022, status: present }
            - control: { mitigation: M1047, status: present }
        reasonJa: 「リンクを知っている全員」などの公開共有が設定で禁止され、定期的に棚卸ししている
      - state: unknown
        when:
          any:
            - control: { mitigation: M1022, status: unknown }
            - control: { mitigation: M1047, status: unknown }
        reasonJa: 公開設定の制限または棚卸しが未確認
      - state: unknown
        when:
          any:
            - control: { mitigation: M1022, status: present }
            - control: { mitigation: M1047, status: present }
        reasonJa: ルールか棚卸しの片方だけ
      - state: breached
        reasonJa: 公開共有を止める設定も棚卸しもない
  - id: data_breach.leak
    role: cloud.storage
    techniques: []
    materialsJa: カルテ：個人情報の所在と件数
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 個人情報が漏えいする。報告と本人通知の期限を表示する

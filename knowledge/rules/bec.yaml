# 判定ルール表：なりすまし送金（被害事例5）
rules:
  - id: bec.leak
    role: cloud.mail_account.exec
    techniques: [T1589.001, T1589, T1110.004]
    materialsJa: カルテ：パスワードの使い回し防止策（パスワード管理ツールなど）
    mitigations: [M1027]
    outcomes:
      - state: breached
        reasonJa: 前提条件として表示する段階。流出の有無の外部確認は MVP の対象外
  - id: bec.takeover
    role: cloud.mail_account.exec
    techniques: [T1078.004, T1078]
    materialsJa: カルテ：クラウドメールの多要素認証の適用範囲と方式
    mitigations: [M1032]
    outcomes:
      - state: breached
        when: { attr: { key: mfaException, equals: true } }
        reasonJa: 社長のアカウントだけ多要素認証の例外になっている
      - state: human
        when:
          all:
            - control: { mitigation: M1032, status: present }
            - attr: { key: mfaMethod, equals: push }
        reasonJa: 承認ボタンを押すだけの方式は、承認要求を大量に送りつける手口に弱い
      - state: blocked
        when: { control: { mitigation: M1032, status: present } }
        reasonJa: 役員を含む全員に多要素認証が強制されている
      - state: unknown
        when: { control: { mitigation: M1032, status: unknown } }
        reasonJa: 多要素認証の適用範囲が未確認
      - state: breached
        reasonJa: 流出したパスワードだけでログインできる
  - id: bec.impersonate
    role: cloud.mail_account.exec
    techniques: [T1684.001, T1684.002]
    materialsJa: カルテ：DMARC などの設定（外部確認でも可）
    mitigations: []
    ineffective:
      - mitigation: M1054
        reasonJa: 本物の社長アカウントから送られるため、DMARC や SPF はこの経路では効きません
    outcomes:
      - state: breached
        reasonJa: 本物のアカウントからの指示なので、メールの認証では見分けられない
  - id: bec.human
    role: person.accounting
    techniques: []
    materialsJa: カルテ：送金・振込先変更の手順
    mitigations: [UD-01, M1017]
    outcomes:
      - state: blocked
        when: { control: { mitigation: UD-01, status: present } }
        reasonJa: 振込先変更や急な送金は、登録済みの連絡先へ折り返して確認する、または二人で承認する手順がある
      - state: human
        when: { control: { mitigation: M1017, status: present } }
        reasonJa: 研修のみ。だまされても仕組みで止まる手順がない
      - state: unknown
        when: { control: { mitigation: UD-01, status: unknown } }
        reasonJa: 送金の手順が未確認
      - state: breached
        reasonJa: 手順も研修もない
  - id: money.reached
    role: impact.money
    techniques: []
    materialsJa: ―
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 資金が流出する。送金額の目安を表示する
  # --- 取引先を装う偽の請求メール（型紙 bec-invoice。乗っ取りなし）。人の段階と資金の流出は上の bec.human / money.reached を使う ---
  - id: bec_invoice.recon
    role: person.accounting
    techniques: [T1589, T1591]
    materialsJa: ―
    mitigations: []
    outcomes:
      - state: breached
        reasonJa: 前提条件として表示する段階。取引先の名前や請求の時期は公開情報や過去のやり取りから集められる
  - id: bec_invoice.mail
    role: person.accounting
    techniques: [T1566.001, T1566.002, T1566.004, T1684.002, T1598]
    materialsJa: カルテ：送金・振込先変更の手順（折り返し確認・二人承認）、研修
    mitigations: [UD-01, M1017]
    ineffective:
      - mitigation: M1054
        reasonJa: SPF・DKIM・DMARC は自社ドメインの偽装を受信側が見分けるための設定で、取引先を装った別のドメイン（よく似た綴りなど）から届くメールには効きません
    outcomes:
      - state: blocked
        when: { control: { mitigation: UD-01, status: present } }
        reasonJa: 振込先変更や急な送金は、登録済みの連絡先へ折り返して確認する、または二人で承認する手順があるので、偽の請求でも止まる
      - state: human
        when: { control: { mitigation: M1017, status: present } }
        reasonJa: 研修のみ。本物に見える請求にだまされても仕組みで止まる手順がない
      - state: unknown
        when: { control: { mitigation: UD-01, status: unknown } }
        reasonJa: 送金の手順が未確認
      - state: breached
        reasonJa: 手順も研修もなく、届いた請求どおりに送金される
  # --- SNS・チャットで社長や取引先を名乗って接触される手口（型紙 bec-invoice の接触の段階が T1566.003 のとき）。TRIAL-B-006 ---
  # 新しい緩和策（UD-05 SNS・チャットの依頼に応じない運用、UD-06 二重承認、UD-07 上限）は、この手口でだけ効く対策として宣言する。
  # 既存の bec.human / bec_invoice.mail の判定は変えない（メールの手口の結果と、デモの一枚は変わらない）
  - id: bec_invoice.sns
    role: person.accounting
    techniques: [T1566.003]
    materialsJa: カルテ：SNS・チャットの依頼への対応、送金・振込先変更の手順（折り返し確認・二人承認）、送金の上限額、研修
    mitigations: [UD-05, UD-01, UD-06, UD-07, M1017]
    outcomes:
      - state: blocked
        when: { control: { mitigation: UD-05, status: present } }
        reasonJa: SNS・チャットのグループ作成や招待の依頼に応じない運用があるので、社長を名乗る接触でも先へ進まない
      - state: blocked
        when: { control: { mitigation: UD-06, status: present } }
        reasonJa: 送金に二人目の承認が要るので、SNS・チャットの指示だけでは送金されない
      - state: blocked
        when: { control: { mitigation: UD-01, status: present } }
        reasonJa: 振込先変更や急な送金は、登録済みの連絡先へ折り返して確認する、または二人で承認する手順があるので、SNS・チャットの指示でも止まる
      - state: recoverable
        when: { control: { mitigation: UD-07, status: present } }
        reasonJa: 一人で送れる額に上限があるので、被害は上限までに抑えられる（上限内の額は送金されうる）
      - state: human
        when: { control: { mitigation: M1017, status: present } }
        reasonJa: 研修のみ。本物の社長に見える接触にだまされても、仕組みで止まる手順がない
      - state: unknown
        when: { control: { mitigation: UD-01, status: unknown } }
        reasonJa: 送金の手順が未確認
      - state: breached
        reasonJa: SNS・チャットの依頼に応じない運用も、二人承認も、上限もなく、指示どおりに送金される

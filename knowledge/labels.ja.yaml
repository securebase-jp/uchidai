# 独自基準（業務手順による対策）。ATT&CK の緩和策と区別して表示する
custom:
  UD-01:
    labelJa: 送金・振込先変更の折り返し確認または二人承認
    descriptionJa: 振込先の変更や急な送金指示は、登録済みの連絡先へ折り返して確認する、または二人で承認する手順
  UD-02:
    labelJa: 保守接続を必要なときだけ有効化・接続元を限定
    descriptionJa: 保守ベンダーの遠隔接続は常時接続にせず、作業時だけ有効にする、または接続元を限定する

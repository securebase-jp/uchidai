# 独自基準（業務手順による対策）。ATT&CK の緩和策と区別して表示する
custom:
  UD-01:
    labelJa: 送金・振込先変更の折り返し確認または二人承認
    descriptionJa: 振込先の変更や急な送金指示は、登録済みの連絡先へ折り返して確認する、または二人で承認する手順
  UD-03:
    labelJa: 異変に気づいたら取引先へ速やかに知らせる手順
    descriptionJa: 不審なメールの送信などに気づいたとき、取引先へ速やかに連絡して注意を促す手順と連絡先の用意
  UD-05:
    labelJa: SNS・チャットのグループ作成や招待の依頼に応じない運用
    descriptionJa: 社長や取引先を名乗る者からの SNS・チャットでの接触（グループの作成や招待の依頼を含む）には、その場で応じず、登録済みの連絡先で本人に確かめるまで口座や残高の話をしない決まり
  UD-06:
    labelJa: 送金の二重承認
    descriptionJa: 送金や振込先の変更は、一人の判断で実行できず、必ず二人目が内容を確かめて承認する手順
  UD-07:
    labelJa: 一人で送金できる上限額の設定
    descriptionJa: 経理担当が一人で送金できる額に上限を決め、超える額は社長など上位者の承認を要するようにする設定
  UD-04:
    labelJa: 委託先の管理（契約・預けているデータの把握・事故連絡）
    descriptionJa: 個人データや重要データを預けている委託先・提供元について、契約、預けているデータの把握、返却・削除、事故時の連絡を決めておく
  UD-02:
    labelJa: 保守接続を必要なときだけ有効化・接続元を限定
    descriptionJa: 保守ベンダーの遠隔接続は常時接続にせず、作業時だけ有効にする、または接続元を限定する

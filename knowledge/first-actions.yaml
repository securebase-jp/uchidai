# 判定の対象外の事故（攻撃経路で判定できない事故）のときに出す、共通の初動。判定は出さず、固定の文を出す（Claude は書かない）
# common：どの対象外の事故にも出す。byTechnique：記事の段階の手法（ATT&CK の ID の前方一致）に当たるときに足す
# 追加するときは、ここに 1 件足すだけ（コードの変更なし）。出典は警察庁「サイバー事案に関する相談窓口」と個人情報保護委員会（knowledge/sources.yaml）
common:
  - 警察のサイバー犯罪相談窓口に相談し、ログなどの記録を消さずに残してください。
byTechnique:
  - id: account
    labelJa: アカウントの乗っ取り・取引先への再送
    techniques: [T1078, T1566, T1534, T1114, T1586, T1684, T1656]
    actionsJa:
      - 取引先に、不審なメールが届いていないかを連絡し、注意を促してください。
      - 乗っ取られたおそれのあるアカウントのパスワードを変更し、サインイン中の端末（セッション）を削除してください。
      - メールの転送ルールに、見覚えのない設定がないかを確認してください。
      - 個人情報が含まれるメールを見られた可能性があるときは、個人情報保護委員会への報告が要るかを判断してください。

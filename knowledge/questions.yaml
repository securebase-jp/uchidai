# 最初の5問と、回答が構成グラフ（役割の枠）とどの緩和策の確認に対応するか
questions:
  - id: industry
    textJa: 御社の業種は？
    options:
      - value: manufacturing
        labelJa: 製造業
        pattern: manufacturing
      - value: construction
        labelJa: 建設業
        pattern: construction
      - value: wholesale_service
        labelJa: 卸売・小売・サービス
        pattern: office
      - value: healthcare
        labelJa: 医療・福祉
        pattern: healthcare
      - value: it
        labelJa: 情報通信
        pattern: office
      - value: finance
        labelJa: 金融・保険
        pattern: office
      - value: other
        labelJa: その他
        pattern: office
  - id: site
    textJa: 現場はありますか？
    options:
      # industries：この選択肢を出す業種（industry の value）。無ければすべての業種に出す。
      #   製造業に診療所は無い、のように、業種に合わない現場は出さない（単一選択のまま）
      # siteBusiness：選ぶと構成図の業務の層に足す「現場の業務」。無ければ（事務所のみ）足さない。
      #   roles は、その業務が止まる元の役割（roles.yaml）。数値は叩き台で、開発者がレビューする。
      #   replaces：構成パターンに同じ業務（業務 ID）が既にあるときは、足さずにその業務を現場の業務に置き換える
      - value: factory
        labelJa: 工場
        industries: [manufacturing, other]
        siteBusiness:
          name: 生産ライン
          roles: [core]
          # 製造業の「生産ライン」と同じ値（製造業×工場は従来と同じ構成になる）
          manualDays: 2
          recoveryDays: 10
          recoveryDaysWithBackup: 2
          affectsJa: 出荷
          replaces: [biz-production]
      - value: warehouse
        labelJa: 倉庫・物流拠点
        industries: [manufacturing, wholesale_service, other]
        siteBusiness:
          name: 倉庫・物流
          roles: [core]
          # 事務所型の「出荷・配送」と同程度（在庫の紙台帳で 1 日は回せる）
          manualDays: 1
          recoveryDays: 7
          recoveryDaysWithBackup: 2
          affectsJa: 取引先への出荷
      - value: construction_site
        labelJa: 工事現場（現場事務所・仮設）
        industries: [construction]
        siteBusiness:
          name: 現場の施工管理
          roles: [core, pc]
          # 建設業の「施工管理」と同じ値。現場事務所の PC からも工程・原価を扱うので pc も止まる元にする
          manualDays: 2
          recoveryDays: 10
          recoveryDaysWithBackup: 2
          affectsJa: 発注者（工期）
          replaces: [biz-construction]
      - value: yard
        labelJa: 資材置き場・倉庫
        industries: [construction]
        siteBusiness:
          name: 置き場の資材管理
          roles: [core]
          # 製造業の出荷より手作業が少し長い（紙の出庫票で回せる）。復旧は建設業の中核システムと同じ
          manualDays: 3
          recoveryDays: 10
          recoveryDaysWithBackup: 2
          affectsJa: 現場への資材の供給
      - value: store
        labelJa: 店舗・支店
        industries: [wholesale_service, finance, other]
        siteBusiness:
          name: 店頭・窓口
          roles: [core, pc]
          # レジや窓口は手書きで 1 日が限度。復旧は事務所型の受注と同程度
          manualDays: 1
          recoveryDays: 7
          recoveryDaysWithBackup: 2
          affectsJa: 来店客の対応
      - value: clinic
        labelJa: 診療所・病院
        industries: [healthcare]
        siteBusiness:
          name: 診療
          roles: [core]
          # 医療・福祉の「診療」と同じ値（医療×診療所は従来と同じ構成になる）
          manualDays: 1
          recoveryDays: 14
          recoveryDaysWithBackup: 3
          affectsJa: 患者と地域
          replaces: [biz-treatment]
      - value: care
        labelJa: 介護・福祉施設
        industries: [healthcare]
        siteBusiness:
          name: 介護・ケア
          roles: [core]
          # 診療より手書きの記録で回せる日数が長い。復旧は電子カルテと同じ。診療の業務は置き換える
          manualDays: 2
          recoveryDays: 14
          recoveryDaysWithBackup: 3
          affectsJa: 利用者と家族
          replaces: [biz-treatment]
      - value: datacenter
        labelJa: データセンター・サーバルーム（自社運用）
        industries: [it]
        siteBusiness:
          name: 自社サーバの運用
          roles: [server, core]
          # 預かっているサービスは手作業で代替できない（0 日）。復旧は製造業の中核システムと同程度、
          # 切り離したバックアップがあれば再構築が早い。クラウドの中核システムでも core があるので消えない
          manualDays: 0
          recoveryDays: 10
          recoveryDaysWithBackup: 3
          affectsJa: 預かっている顧客のサービス
      - value: onsite_team
        labelJa: 客先に常駐するチームがある
        industries: [it]
        siteBusiness:
          name: 客先常駐の対応
          roles: [pc]
          # 客先で使う PC は再設定で戻る。紙とメモで数日は回せる。保守ベンダーの遠隔接続（入口）は
          # 「社外からのつなぎ方」の問いが決めるので、ここでは業務を足すだけにする
          manualDays: 3
          recoveryDays: 5
          recoveryDaysWithBackup: 2
          affectsJa: 常駐先（客先）への提供
      - value: office_only
        labelJa: 事務所のみ
  - id: hosting
    textJa: 主な仕事の置き場所は？（メール、ファイル、中核の業務システム、ホームページ）
    hintJa: 例：Microsoft 365、Google Workspace、kintone、freee、レンタルサーバ
    rows:
      - key: mail
        labelJa: メール
        roles: { onprem: null, cloud: cloud.mail, provider: cloud.mail, unknown: cloud.mail }
      - key: files
        labelJa: ファイルサーバ（ファイル共有）
        roles:
          {
            onprem: file_server,
            cloud: cloud.storage,
            provider: cloud.storage,
            unknown: file_server,
          }
      - key: core
        labelJa: 中核の業務システム（販売・生産・会計など）
        roles: { onprem: core, cloud: core, provider: core, unknown: core }
        sideByValue: { onprem: internal, cloud: external, provider: external, unknown: internal }
      - key: web
        labelJa: ホームページ
        roles: { onprem: entry.web, cloud: entry.web, provider: entry.web, unknown: entry.web }
    options: [onprem, cloud, provider, unknown]
    optionLabelsJa:
      {
        onprem: 社内のサーバ,
        cloud: クラウドサービス,
        provider: レンタルサーバ・プロバイダ,
        unknown: 分からない,
      }
  - id: remoteAccess
    textJa: 社外からのつなぎ方は？（複数選択）
    multi: true
    options:
      - value: vpn
        labelJa: VPN装置
        addsRole: entry.vpn
        checks: [M1051, M1032, M1042]
      - value: rdp
        labelJa: リモートデスクトップなどの遠隔操作ツール
        addsRole: entry.rdp
        checks: [M1032, M1035]
      - value: vendor_remote
        labelJa: 保守ベンダーの遠隔接続
        addsRole: entry.vendor_remote
        checks: [M1032, UD-02, M1035]
      - value: cloud_only
        labelJa: クラウドサービスだけ
      - value: unknown
        labelJa: 分からない
        unknownEntries: [entry.vpn, entry.rdp, entry.vendor_remote]
  - id: backup
    textJa: バックアップの方式は？
    options:
      - value: same_network
        labelJa: 同じ社内ネットワーク
        attrs: { method: same_network, isolated: false }
      - value: cloud_sync
        labelJa: クラウド同期
        attrs: { method: cloud_sync, isolated: false }
      - value: isolated
        labelJa: 切り離した保管先
        attrs: { method: isolated, isolated: true }
        checks: [M1053]
      - value: none
        labelJa: なし
        attrs: { method: none, isolated: false }
      - value: unknown
        labelJa: 分からない
        attrs: {}

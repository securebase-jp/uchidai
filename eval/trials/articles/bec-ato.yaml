# 実記事の試験（BEC と、メール・アカウントの乗っ取り）に使う記事 19 件（2026-11-05 収集）
# 本文はリポジトリに入れない。取得した本文は eval/.cache/trials/<id>/article.txt（git 管理外）。
# ここには出典 URL・自分の言葉での要約・期待ラベルだけを書く。記事の文は引用しない。
#
# kind：期待する被害の種類。damage-types.yaml の id（bec）か、account_takeover（メール・アカウントの乗っ取り。
#       現状は型紙が無いので、プロダクトは out_of_scope にするはず。TRIAL-006）
# alsoAcceptable：kind のほかに、読解として妥当と認める種類（境目の記事）
# entry：記事から分かる入口・手口（分からなければ「記載なし」）
# heldOut：true の記事は「最後の測定用」。収集と期待ラベル付けだけ行い、このセッションでは通さない
#   決め方：BEC と乗っ取りをそれぞれ公開日の順に並べ、3 件おき（BEC は 3・6・9 番目、乗っ取りは 3・6・9 番目）
#   BEC の並び：ipa-2023, 3dmatrix, ipa-2024*, survey-2024, sanshin, fin-6oku*, npa-nise, kyoto-boeki, oita*, odawara（* が heldOut。odawara は 10 番目）
#   乗っ取りの並び：nmr, kawai, sakura*, jems, toho, proofpoint-rules*, kodansha, m365-mfa, hotel*
articles:

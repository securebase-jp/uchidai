# 実在の被害記事を 100 件参照する取り組みのうち、「情報漏えい」の 21 件（docs/article-trials/breach.md）
# 収集日：2026-11-05。本文はリポジトリに入れない。取得した本文は eval/.cache/trials/<id>/article.txt（git 管理外）。
#
# kind：期待する被害の型（data_breach など）。境界の事例は expectNote に書く
# entry：記事に書かれた入口・原因。書かれていなければ none。
#   vuln-exploit … 製品・機器の脆弱性の悪用（T1190）
#   web-app-flaw … 自社の Web サイト・アプリの欠陥や残置プログラムからの侵入、決済アプリの改ざん（T1190）
#   credential-abuse … 認証情報の悪用・不正ログイン（T1078、T1110）
#   cloud-misconfig … クラウド・SaaS・フォーム・管理画面などの共有設定・公開設定・権限の誤り（T1530 など）
#   vendor … 委託先・取引先・SaaS 提供元経由（T1199 など）
#   none … 記事に書かれていない
# size：事業者の規模の目安（小：個人・小規模、中：中小〜中堅、大：大企業・全国規模）
# heldOut：true は「最後の測定用」。期待ラベルまでで、この取り組みでは通さない（チューニングに使わない）。
#   時系列に並べて 3 件おきに決めた（原因と年が偏らないことを確認済み）
# 2026-11-06 の最終の再実行で、heldOut: true の記事も通した（heldOut の値は変えていない）。結果は docs/article-trials/final-rerun-2026-11-06.md。

# 企業自身の公表（IR・お知らせ・適時開示）の試験の一覧（東証プライム上場企業の公表。2026-11-05 収集）
#
# 公表の本文は入れない（出典 URL、自分の言葉の要約、期待するラベルだけ）。本文は取得して
# eval/.cache/trials/<id>/article.txt に置く（git 管理外）。取得は eval/trials/fetch-batch.ts。
#
# 集め方と、網羅できていない範囲は docs/article-trials/ir-disclosures.md に書いた。
# 全上場企業を巡回して集めたものではない。公開の検索で見つかった公表だけを、JPX の「東証上場銘柄一覧」
# （2026-10-31 時点、内国株式のプライム 1,553 社）と突き合わせて、プライムの会社のものだけを残した。
#
# 項目
#   company / code  会社名と証券コード（親会社がプライム。子会社の事故を親会社が公表したものを含む）
#   sector          JPX の 33 業種区分
#   format          html / pdf（公表の形式）
#   series          続報の系列。<系列名>:<第 N 報> または <系列名>:<区分>（initial / final など）。同じ事故の公表を結ぶ
#   kind            期待する被害の種類。damage-types.yaml の id（ransomware / data_breach / account_takeover / bec）か、
#                   out_of_scope（型紙の対象外。Web 改ざん、なりすましの注意喚起など）
#   alsoAcceptable  kind のほかに、読解として妥当と認める種類（境目の公表）
#   entry           公表に書かれた入口。vpn / network-device / vendor（委託先・提供元・提携先）/ credential / web / mail / none（書かれていない）
#   victim          被害を受けた側。self（自社）/ subsidiary（子会社・孫会社）/ vendor（委託先・提供元の事故が自社に波及）/ partner（取引先・提携先の事故の周知）
#   fetched         true は取得して本文が読めたもの。false は取得できなかったもの（理由は fetchNote）。取得は URL ごとに 1 回だけ
#   expectNote      期待の根拠（自分の言葉。公表の文は引用しない）
#
# 最後の測定用の取り分けはしていない（この試験は全件を通す）。

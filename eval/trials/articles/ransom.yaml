# ランサムウェア記事の試験の一覧（実記事の試験・100 件計画のうちランサムウェア 24 件）
#
# 記事の本文は入れない（出典 URL、自分の言葉の要約、期待するラベルだけ）。本文は取得して
# eval/.cache/trials/<id>/article.txt に置く（git 管理外）。取得は eval/trials/fetch-batch.ts。
#
# 項目
#   kind         期待する被害の種類（damage type）。ここはすべて ransomware
#   entry        記事に書かれた入口。vpn / rdp / network-device（VPN 以外のネットワーク機器・リモートアクセス機器）/
#                vendor（委託先・再委託先経由）/ credential（正規の認証情報の悪用）/ internet（インターネット経由とだけ書かれる）/ none（書かれていない）
#   extortion    double（データ持ち出し・公開・脅迫が記事にある）/ encrypt-only（暗号化のみ、持ち出しの痕跡なし）/ unclear
#   size         規模の目安（従業員数）。sizeBasis が stated なら記事に書いてある値、rough なら記事の外の一般的な規模感の概算
#   heldOut      true は「最後の測定用」。収集とラベル付けだけして、この試験では通さない
#   publishedAt  記事の公開日（Security NEXT は本文末尾の日付、ScanNetSecurity は URL の日付）
#   expectNote   期待の根拠（自分の言葉。記事の文は引用しない）
#
# 規模・業種・年・入口が偏らないよう選び、公開日の順に並べて 3〜4 件おきに heldOut にした
# （公開日順の 3、6、10、13、17、20、24 番目）。heldOut は公開日の昇順のリストの位置で示す（order）。

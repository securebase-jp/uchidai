    size: 大企業
    heldOut: true
    expectNote: 海外子会社のリモートアクセス用 VPN 装置から社内ネットワークに入られ、複数のファイルサーバが読み出された可能性。暗号化や脅迫は無い。入口は「子会社の接続」。


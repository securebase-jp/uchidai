# 実記事の試験（取引先・委託先・サプライチェーン経由 10 件と、対象外であるべき記事 7 件）の一覧
# 結果と課題は docs/article-trials/supply-oos.md。本文はリポジトリに入れない（取得した本文は eval/.cache/trials/<id>/article.txt、git 管理外）。
# 取得日はすべて 2026-11-05。URL は実際に取得して確かめた。
#
# kind：期待する被害の種類（ransomware / data_breach / bec / out_of_scope）。alsoOk は、記事の書き方によりもう一つ許容できる種類
# entry：期待する入口の種類（ウチダイの入口の役割に対応するかを見るための印。自由記述）
#   contractor_system＝委託先・再委託先のシステム、maintenance_vpn＝保守委託先が管理する VPN 機器、
#   subsidiary_remote＝子会社のリモート接続機器、contractor_account＝委託先の窃取された認証情報、
#   vendor_outage＝取引先（物流委託先）の被害の波及（自社は侵入されていない）、software_distribution＝ソフトウェアの配布サイトの改ざん、
#   software_update＝ソフトウェアの更新機構の乗っ取り、cloud_vendor＝外部クラウドサービスの侵害
# heldOut：true の記事は「最後の測定用」。収集と期待ラベル付けだけ行い、このセッションでは通さない
# 2026-11-06 の最終の再実行で、heldOut: true の記事も通した（heldOut の値は変えていない）。結果は docs/article-trials/final-rerun-2026-11-06.md。
articles:
  # ===== 取引先・委託先・サプライチェーン経由（10 件） =====
  - id: supply-sekisui-yamaguchi
    url: https://www.security-next.com/150256
    media: Security NEXT
    title: 委託先がランサム被害、発注データ流出のおそれ - 積水ハウス
    publishedAt: "2023-10-17"
    kind: ransomware
    alsoOk: [data_breach]
    entry: contractor_system
    industry: 住宅（委託元）／金属加工（委託先）
    size: 委託元は大企業、委託先は中小規模の製造業
    heldOut: false
    expectNote: 委託先の生産システムのサーバが脆弱性を突かれてランサム感染し、委託元の顧客の発注データ約 11 万件が流出したおそれ。委託元は侵入されていない。入口は「委託先のシステム」。

  - id: supply-murata-subsidiary
    url: https://www.security-next.com/147025
    media: Security NEXT
    title: 複数サーバが侵害被害、海外子会社のVPN装置経由で - 村田製作所
    publishedAt: "2023-06-19"
    kind: data_breach
    alsoOk: [ransomware]
    entry: subsidiary_remote

# 実際の報道記事での読解・対応づけの評価に使う記事の一覧（P3、2026-11-02 収集）
# 本文はリポジトリに入れない。取得した本文は eval/.cache/articles/（git 管理外）に置く。
# expectedDamageType：想定する被害の型。expectedEntry：想定する入口の手法 ID（記事から分かる範囲。分からなければ空）
# expectedTemplate：想定する型紙（knowledge/templates の id）。入口不明で候補展開になる記事、対象外の記事、型紙のどれにも当たらない手口（偽警察の電話＋遠隔操作）は省略
# pages：媒体側のページ分割数（Security NEXT は長い記事を /2 に分ける。取り込みの確認用）
articles:
  # --- ランサムウェアによる業務停止（4 本） ---
  - id: ransom-autome
    url: https://www.security-next.com/167242
    media: Security NEXT
    date: "2025-02-18"
    title: VPN経由でランサム被害 - 産業機械開発設計会社
    expectedDamageType: ransomware
    expectedEntry: [T1133, T1190]
    expectedTemplate: ransomware
    summaryJa: 産業機械の設計・製図会社（オートメ技研）。VPN 機器経由で侵害され、サーバ内のデータが暗号化。再発防止に VPN のパスワード見直しと 2 段階認証
    pages: 1
  - id: ransom-nihonkai
    url: https://www.security-next.com/166531
    media: Security NEXT
    date: "2025-01-27"
    title: VPN経由でランサム被害、闇サイト上に取引情報 - 日本海建設電気
    expectedDamageType: ransomware
    expectedEntry: [T1190]
    expectedTemplate: ransomware
    summaryJa: 日本海建設電気。UTM が最新版に更新されておらず VPN 経由で侵害。サーバの一部データが暗号化され、取引情報がリークサイトに公開（二重恐喝）
    pages: 2
  - id: ransom-shinhokoku
    url: https://www.security-next.com/176860
    media: Security NEXT
    date: "2025-11-07"
    title: 一部サーバでランサム被害、バックアップ削除も - 新報国マテリアル
    expectedDamageType: ransomware
    expectedEntry: [T1190, T1133]
    expectedTemplate: ransomware
    summaryJa: 特殊合金の製造・販売（新報国マテリアル）。ネットワーク機器経由で外部から侵入され、社内サーバの一部ファイルが暗号化、一部バックアップが削除
    pages: 2
  - id: ransom-mitsui
    url: https://www.security-next.com/168949
    media: Security NEXT
    date: "2025-04-07"
    title: 基幹システムがランサム被害、リモートデスクトップ経由か - 美容関連商社
    expectedDamageType: ransomware
    expectedEntry: [T1133, T1021.001]
    expectedTemplate: ransomware
    summaryJa: 美容商材の商社（ミツイコーポレーション）。リモートデスクトップが悪用されて基幹システムのサーバがランサムウェア被害。顧客氏名などが流出した可能性
    pages: 1
  # --- なりすまし送金（ビジネスメール詐欺）（2 本） ---
  - id: bec-veltra
    url: https://www.itmedia.co.jp/news/articles/2602/06/news116.html
    media: ITmedia NEWS
    date: "2026-02-06"
    title: ニセ代表取締役「5000万円送金して」──上場企業の子会社が詐欺被害 虚偽のメールに社員がだまされる
    expectedDamageType: bec
    expectedEntry: [T1684.001, T1566.002]
    expectedTemplate: bec-invoice
    summaryJa: ベルトラ子会社（リンクティビティ）。代表者を装ったメールで社外 SNS に誘導され、経理担当者が虚偽の送金指示に従い約 5,000 万円を窓口で送金
    pages: 1
  - id: bec-hatena
    url: https://www.itmedia.co.jp/news/articles/2604/24/news127.html
    media: ITmedia NEWS
    date: "2026-04-24"
    title: はてな、11億円の資金流出 振り込め詐欺か
    expectedDamageType: bec
    expectedEntry: []
    expectedTemplate: bec-invoice
    summaryJa: はてな。第三者からの虚偽の送金指示により、従業員のアカウントから最大約 11 億円が外部口座へ送金。取引先銀行からの連絡で発覚。手口の詳細は未公表
    pages: 1
  # --- 不正アクセス・設定ミスによる情報漏えい（3 本） ---
  - id: breach-cosmo
    url: https://www.security-next.com/171527
    media: Security NEXT
    date: "2025-06-23"
    title: クラウドのファイル権限に設定ミス、URL指定でアクセス可能 - コスモ石油マーケ
    expectedDamageType: data_breach
    expectedEntry: [T1530]
    expectedTemplate: data_breach
    summaryJa: コスモ石油マーケティング。クラウド上のファイルの閲覧制限の設定ミスで、URL を直接指定すると顧客情報を含むファイルが外部から閲覧できる状態だった
    pages: 1
  - id: breach-miyazaki
    url: https://www.security-next.com/177147
    media: Security NEXT
    date: "2025-11-19"
    title: クラウドサービスが侵害、顧客従業員情報が流出か - ITサービス事業者
    expectedDamageType: data_breach
    expectedEntry: []
    summaryJa: 宮崎通信。委託元向けに提供する情報管理クラウドサービスが外部から侵害され、委託元の従業員の氏名・社員番号・メールアドレスなどが流出した可能性。侵入経路は未公表
    pages: 1
  - id: breach-curtain
    url: https://www.security-next.com/180183
    media: Security NEXT
    date: "2026-01-27"
    title: カーテン通販サイトで決済アプリ改ざん - 個人情報流出の可能性
    expectedDamageType: data_breach
    expectedEntry: [T1190]
    expectedTemplate: data-breach-web
    summaryJa: インテリックス（ジャストカーテンオンラインショップ）。システムの脆弱性を突いた不正アクセスで決済アプリケーションが改ざんされ、カード情報 1 万件超が流出した可能性
    pages: 2
  # --- 対象外になるべき事故（2 本） ---
  - id: oos-konekuto
    url: https://www.security-next.com/174040
    media: Security NEXT
    date: "2025-09-02"
    title: 利用者の個人情報含むファイルをメールで誤送信 - 就労移行支援事業所
    expectedDamageType: out_of_scope
    expectedEntry: []
    summaryJa: 就労移行支援事業所（こねくと）。体験利用者 1 人に、他の利用者の個人情報を含む表計算ファイルをメールで誤送信。攻撃ではなく誤送信
    pages: 1
  - id: oos-prudential
    url: https://www.security-next.com/170955
    media: Security NEXT
    date: "2025-06-04"
    title: 元従業員が顧客情報持ち出し、在職者も関与 - プルデンシャル生命
    expectedDamageType: out_of_scope
    expectedEntry: []
    summaryJa: プルデンシャル生命。元従業員が顧客の契約情報を持ち出し、在職者 3 人も依頼に応じて漏らしていた。内部不正
    pages: 1
  # --- 長い本文の取り込み確認（まとめ記事、1 本） ---
  - id: bec-hatena-piyolog
    url: https://piyolog.hatenadiary.jp/entry/2026/07/30/075612
    media: piyolog（はてなブログ）
    date: "2026-07-30"
    title: はてなで起きた不正送金による資金流出についてまとめてみた
    expectedDamageType: bec
    expectedEntry: []
    summaryJa: はてなの不正送金のまとめ。偽の警察官が経理部長に電話で接触し、遠隔操作ツールを入れさせて送金させた（約 1 万字。サイドバーなど本文以外の文が多いページの取り込み確認用）
    pages: 1

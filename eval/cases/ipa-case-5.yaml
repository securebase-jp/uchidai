id: ipa-case-5
title: 被害事例5：社長メールアカウント乗っ取りによる送金詐欺
status: draft
source:
  citation: 出典：IPA「中小企業のための実例で学ぶサイバーセキュリティリスク事例集」より抜粋
  url: https://www.ipa.go.jp/security/reports/sme/rcu1hd0000009k82-att/sme-jirei.pdf
  # PDF のページ番号（1 始まり）。紙面に印字された番号は 1 小さい
  pages: "31"
  summary: >-
    製造業（30名）。外部サービスから流出したパスワードの使い回しで社長のクラウドメールに入られ、
    社長になりすました送金指示で経理担当が500万円を送金した。
    2026-11-02 S1：型紙 bec の最初の段階「パスワードが流出している」（TA0043、T1589.001 / T1110.004 を受け入れる）に合わせ、
    戦術は TA0043 のまま、認める ID に T1110.004（流出パスワードの使い回し）を足した。被害の段階として送金（T1657）を追加した。
expected:
  damageType: bec
  clarity: clear
  usedInDemo: true
  verdict: breached
  steps:
    - label: 流出したパスワードの使い回し
      tactic: TA0043
      techniques: [T1589.001, T1589, T1110.004]
      source: stated
      quoteHint: パスワード
    - label: 社長のメールに入られる
      tactic: TA0001
      techniques: [T1078.004, T1078]
      source: stated
      quoteHint: アカウント
    - label: 社長になりすまして指示する
      tactic: TA0005
      techniques: [T1684.001, T1656]
      source: stated
      quoteHint: 騙
    - label: 攻撃者の口座へ送金
      tactic: TA0040
      techniques: [T1657]
      source: stated
      quoteHint: 送金

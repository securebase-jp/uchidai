# 正解データ。2026-11-03 に開発者がレビューして確定（Issue #16）。本文は含めない
id: ipa-case-5
title: 被害事例5：社長メールアカウント乗っ取りによる送金詐欺
status: confirmed
source:
  citation: 出典：IPA「中小企業のための実例で学ぶサイバーセキュリティリスク事例集」より抜粋
  url: https://www.ipa.go.jp/security/reports/sme/rcu1hd0000009k82-att/sme-jirei.pdf
  # PDF のページ番号（1 始まり）。紙面に印字された番号は 1 小さい
  pages: "31"
  # 2026-11-02 S1：型紙 bec の最初の段階「パスワードが流出している」（TA0043）に合わせ、被害の段階として送金（T1657）を追加した
  summary: >-
    製造業（30名）。外部サービスから流出したパスワードの使い回しで社長のクラウドメールに入られ、
    社長になりすました送金指示で経理担当が500万円を送金した。
expected:
  damageType: bec
  clarity: clear
  usedInDemo: true
  # デモ精工の社長アカウントは多要素認証の例外扱い（M1032 なし）なので乗っ取られる
  verdict: breached
  # 型紙 bec の「経理担当が送金する」（TA0002）は正解に置かない。送金（TA0040）の段階が経理担当の行為を含むと割り切る
  steps:
    # TA0043 の中身は「外部サービスからパスワードが流出していた」こと。使い回しによるログインは次の段階
    - label: 外部サービスからパスワードが流出
      tactic: TA0043
      techniques: [T1589.001, T1589]
      source: stated
      quoteHint: パスワード
    # 流出パスワードの使い回し（T1110.004）はこのログインの段階に置く（監査 A1 の指摘、型紙 bec の takeover と同じ）
    - label: 社長のメールに入られる
      tactic: TA0001
      techniques: [T1078.004, T1078, T1110.004]
      source: stated
      quoteHint: アカウント
    # 廃止済みの T1656 は外した（ATT&CK v20 で T1684.001 に統合）
    - label: 社長になりすまして指示する
      tactic: TA0005
      techniques: [T1684.001]
      source: stated
      quoteHint: 騙
    - label: 攻撃者の口座へ送金
      tactic: TA0040
      techniques: [T1657]
      source: stated
      quoteHint: 送金
